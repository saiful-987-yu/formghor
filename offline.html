<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অফলাইন - ফর্মঘর</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light dark;--bg:#f4f4f5;--card:#fff;--text:#121212;--muted:#6b6b73;--ink:#121212;--ink-text:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#17171a;--text:#f4f4f5;--muted:#a0a0a8;--ink:#f4f4f5;--ink-text:#121212}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;padding:36px 28px;border-radius:28px;background:var(--card);text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.08)}
img{width:56px;height:56px;margin-bottom:18px}
h1{margin:0 0 8px;font-size:1.4rem}
p{margin:0 0 6px;color:var(--muted);line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
a,button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--ink-text);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
a{background:transparent;color:var(--text)}
</style>
</head>
<body>
<main>
<img src="assets/icons/logo.svg" alt="">
<h1>আপনি অফলাইনে আছেন</h1>
<p>এই পেজ এখনো ফোনে সেভ করা নেই। ইন্টারনেট এলে আবার চেষ্টা করুন।</p>
<p>You are offline. This page is not saved on your device yet.</p>
<div class="row">
<button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
<a href="index.html">হোমে যান</a>
</div>
</main>
</body>
</html>
