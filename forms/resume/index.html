<body class="f-resume" data-form="resume">
<div id="g-form-pages">
<section class="g-page" lang="en">
<div class="g-page-inner">
<div class="hdr">
<div class="ht">
<input class="g-in nm" name="full_name" type="text" placeholder="Your Full Name" data-fill="name">
<input class="g-in tt" name="job_title" type="text" placeholder="Job Title | Field of Work">
</div>
<label class="g-photo pic" style="--w:30mm;--h:36mm">
<input type="file" accept="image/*" name="photo" data-fill="photo">
<span class="g-photo-hint">Click to<br>add photo</span>
</label>
</div>
<div class="cols">
<div class="main">
<h3 class="mh">Profile</h3>
<textarea class="g-in g-ta prof" name="profile" rows="4" placeholder="Three or four lines about your experience, strengths and what you are looking for."></textarea>
<h3 class="mh">Work Experience</h3>
<div class="job">
<div class="jh"><input class="g-in jt" name="exp1_title" type="text" placeholder="Job title"><input class="g-in dt" name="exp1_date" data-kind="mon" type="text" placeholder="Mon yyyy - Mon yyyy"></div>
<input class="g-in jc" name="exp1_company" type="text" placeholder="Company name | Place">
<div class="jb"><span>&bull;</span><textarea class="g-in g-ta" name="exp1_b1" rows="1" placeholder="What you did, in one or two lines."></textarea></div>
<div class="jb"><span>&bull;</span><textarea class="g-in g-ta" name="exp1_b2" rows="1" placeholder="Another responsibility or result."></textarea></div>
</div>
<div class="job">
<div class="jh"><input class="g-in jt" name="exp2_title" type="text" placeholder="Job title"><input class="g-in dt" name="exp2_date" data-kind="mon" type="text" placeholder="Mon yyyy - Mon yyyy"></div>
<input class="g-in jc" name="exp2_company" type="text" placeholder="Company name | Place">
<div class="jb"><span>&bull;</span><textarea class="g-in g-ta" name="exp2_b1" rows="1" placeholder="What you did, in one or two lines."></textarea></div>
<div class="jb"><span>&bull;</span><textarea class="g-in g-ta" name="exp2_b2" rows="1" placeholder="Another responsibility or result."></textarea></div>
</div>
<div class="job">
<div class="jh"><input class="g-in jt" name="exp3_title" type="text" placeholder="Job title"><input class="g-in dt" name="exp3_date" data-kind="mon" type="text" placeholder="Mon yyyy - Mon yyyy"></div>
<input class="g-in jc" name="exp3_company" type="text" placeholder="Company name | Place">
<div class="jb"><span>&bull;</span><textarea class="g-in g-ta" name="exp3_b1" rows="1" placeholder="What you did, in one or two lines."></textarea></div>
<div class="jb"><span>&bull;</span><textarea class="g-in g-ta" name="exp3_b2" rows="1" placeholder="Another responsibility or result."></textarea></div>
</div>
<h3 class="mh">Education</h3>
<div class="ed">
<div class="eh"><input class="g-in b" name="edu1_exam" type="text" placeholder="Exam or degree"><input class="g-in dt" name="edu1_period" data-kind="mon" type="text" placeholder="Mon yyyy - Mon yyyy"></div>
<input class="g-in" name="edu1_institution" type="text" placeholder="Institution name | Place">
<input class="g-in rs" name="edu1_result" type="text" placeholder="GPA / Result">
</div>
<div class="ed">
<div class="eh"><input class="g-in b" name="edu2_exam" type="text" placeholder="Exam or degree"><input class="g-in dt" name="edu2_period" data-kind="mon" type="text" placeholder="Mon yyyy - Mon yyyy"></div>
<input class="g-in" name="edu2_institution" type="text" placeholder="Institution name | Place">
<input class="g-in rs" name="edu2_result" type="text" placeholder="GPA / Result">
</div>
<h3 class="mh">Training &amp; Certificates</h3>
<div class="ct2"><span>&bull;</span><input class="g-in" name="cert1" type="text" placeholder="Course or certificate | Institute | Year"></div>
<div class="ct2"><span>&bull;</span><input class="g-in" name="cert2" type="text" placeholder="Course or certificate | Institute | Year"></div>
</div>
<div class="side">
<h3 class="sh">Contact</h3>
<div class="ci"><b>Phone</b><input class="g-in" name="phone" data-kind="phone" type="tel" placeholder="01XXXXXXXXX" data-fill="phone"></div>
<div class="ci"><b>Email</b><input class="g-in" name="email" type="email" placeholder="name@example.com" data-fill="email"></div>
<div class="ci"><b>Address</b><textarea class="g-in g-ta" name="address" rows="1" placeholder="Area, upazila, district" data-fill="address"></textarea></div>
<div class="ci"><b>Website / Profile</b><input class="g-in" name="link" type="text" placeholder="www.example.com"></div>
<h3 class="sh">Skills</h3>
<div class="sk"><input class="g-in" name="skill1" type="text" placeholder="Skill"></div>
<div class="sk"><input class="g-in" name="skill2" type="text" placeholder="Skill"></div>
<div class="sk"><input class="g-in" name="skill3" type="text" placeholder="Skill"></div>
<div class="sk"><input class="g-in" name="skill4" type="text" placeholder="Skill"></div>
<div class="sk"><input class="g-in" name="skill5" type="text" placeholder="Skill"></div>
<div class="sk"><input class="g-in" name="skill6" type="text" placeholder="Skill"></div>
<h3 class="sh">Languages</h3>
<div class="lg"><input class="g-in b" name="lang1_name" type="text" placeholder="Language"><input class="g-in" name="lang1_level" type="text" placeholder="Level"></div>
<div class="lg"><input class="g-in b" name="lang2_name" type="text" placeholder="Language"><input class="g-in" name="lang2_level" type="text" placeholder="Level"></div>
<div class="lg"><input class="g-in b" name="lang3_name" type="text" placeholder="Language"><input class="g-in" name="lang3_level" type="text" placeholder="Level"></div>
<h3 class="sh">Personal Details</h3>
<div class="pr"><span>Date of Birth</span><input class="g-in" name="birth_date" data-kind="date" type="text" placeholder="dd/mm/yyyy" data-fill="birth"></div>
<div class="pr"><span>Nationality</span><input class="g-in" name="nationality" type="text" placeholder="Nationality" data-fill="nationality"></div>
<div class="pr"><span>Marital Status</span><input class="g-in" name="marital_status" type="text" placeholder="Single / Married" data-fill="marital" data-fill-lang="en"></div>
<div class="pr"><span>Blood Group</span><input class="g-in" name="blood_group" type="text" placeholder="e.g. B+" data-fill="blood"></div>
</div>
</div>
</div>
</section>
</div>

<script src="form.js"></script>
</body>
</html>
