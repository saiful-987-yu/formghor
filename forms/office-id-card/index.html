<body class="f-office-id-card" data-form="office-id-card">
<div id="g-form-pages">
<section class="g-page" lang="bn">
<div class="g-page-inner">
<div class="cards">
<div class="card">
<span class="slot" aria-hidden="true"></span>
<div class="hd" aria-hidden="true"></div>
<label class="g-photo lgo" style="--w:13mm;--h:13mm">
<input type="file" accept="image/*" name="logo">
<span class="g-photo-hint">লোগো</span>
</label>
<input class="g-in org" name="org_name" type="text" placeholder="প্রতিষ্ঠানের নাম">
<label class="g-photo pic" style="--w:23mm;--h:27mm">
<input type="file" accept="image/*" name="photo" data-fill="photo">
<span class="g-photo-hint">ছবি দিতে<br>ক্লিক করুন</span>
</label>
<input class="g-in nm" name="name" type="text" data-fill="name" placeholder="কর্মীর নাম">
<input class="g-in ds" name="designation" type="text" placeholder="পদবী">
<input class="g-in dp" name="department" type="text" placeholder="বিভাগ">
<div class="ln idn"><span>ID:</span><input class="g-in" name="emp_id" type="text" placeholder="আইডি নম্বর"></div>
<span class="ft" aria-hidden="true"></span>
</div>
<div class="card">
<span class="slot" aria-hidden="true"></span>
<div class="hd hd2" aria-hidden="true"></div>
<div class="bt"><b>কর্মচারীর তথ্য</b><span>Employee Information</span></div>
<div class="rows">
<div class="ln"><span>মোবাইল:</span><input class="g-in" name="phone" data-kind="phone" type="tel" data-fill="phone" placeholder="০১XXXXXXXXX"></div>
<div class="ln"><span>ইমেইল:</span><input class="g-in" name="email" type="email" data-fill="email" placeholder="ইমেইল"></div>
<div class="ln"><span>রক্তের গ্রুপ:</span><input class="g-in bd" name="blood" type="text" maxlength="3" data-fill="blood" placeholder="A+"></div>
<div class="ln"><span>যোগদান:</span><input class="g-in" name="join_date" data-kind="date" type="text" placeholder="দিন/মাস/বছর"></div>
<div class="ln"><span>মেয়াদ:</span><input class="g-in" name="valid_till" data-kind="date" type="text" placeholder="দিন/মাস/বছর"></div>
</div>
<p class="rt">এই কার্ড হারিয়ে গেলে বা কুড়িয়ে পেলে অনুগ্রহ করে নিচের ঠিকানায় ফেরত দিন।</p>
<div class="ob">
<textarea class="g-in g-ta" name="org_address" rows="2" placeholder="প্রতিষ্ঠানের ঠিকানা"></textarea>
<input class="g-in" name="org_contact" type="text" placeholder="ফোন / ওয়েবসাইট">
</div>
<div class="sg"><span class="sl"></span><span>প্রদানকারী কর্তৃপক্ষের স্বাক্ষর</span></div>
<span class="ft" aria-hidden="true"></span>
</div>
</div>
</div>
</section>
</div>
