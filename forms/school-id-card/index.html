<body class="f-school-id-card" data-form="school-id-card">
<div id="g-form-pages">
<section class="g-page" lang="bn">
<div class="g-page-inner">
<div class="cards">
<div class="card">
<span class="slot" aria-hidden="true"></span>
<div class="hd" aria-hidden="true"></div>
<label class="g-photo lgo" style="--w:12mm;--h:12mm">
<input type="file" accept="image/*" name="logo">
<span class="g-photo-hint">লোগো</span>
</label>
<textarea class="g-in g-ta org" name="org_name" rows="2" placeholder="প্রতিষ্ঠানের নাম"></textarea>
<label class="g-photo pic" style="--w:21mm;--h:25mm">
<input type="file" accept="image/*" name="photo" data-fill="photo">
<span class="g-photo-hint">ছবি দিতে<br>ক্লিক করুন</span>
</label>
<input class="g-in nm" name="name" type="text" data-fill="name" placeholder="শিক্ষার্থীর নাম">
<div class="trio">
<div class="fd"><span>শ্রেণি</span><input class="g-in" name="class_name" type="text" placeholder="শ্রেণি"></div>
<div class="fd"><span>শাখা</span><input class="g-in" name="section" type="text" placeholder="শাখা"></div>
<div class="fd"><span>রোল</span><input class="g-in" name="roll" type="text" placeholder="রোল"></div>
</div>
<div class="ln idn"><span>ID</span><input class="g-in" name="student_id" type="text" placeholder="আইডি নম্বর"></div>
<span class="ft" aria-hidden="true"></span>
</div>
<div class="card">
<span class="slot" aria-hidden="true"></span>
<div class="hd hd2" aria-hidden="true"></div>
<div class="bt"><b>শিক্ষার্থীর তথ্য</b><span>Student Information</span></div>
<div class="rows">
<div class="fd"><span>পিতার নাম</span><input class="g-in" name="father_name" type="text" data-fill="father" placeholder="পিতার নাম"></div>
<div class="fd"><span>মাতার নাম</span><input class="g-in" name="mother_name" type="text" data-fill="mother" placeholder="মাতার নাম"></div>
<div class="two">
<div class="fd"><span>জন্ম তারিখ</span><input class="g-in" name="birth_date" type="text" data-fill="birth" placeholder="দিন/মাস/বছর"></div>
<div class="fd"><span>রক্তের গ্রুপ</span><input class="g-in bd" name="blood" type="text" maxlength="3" data-fill="blood" placeholder="A+"></div>
</div>
<div class="two">
<div class="fd"><span>অভিভাবকের মোবাইল</span><input class="g-in" name="guardian_phone" type="tel" data-fill="phone" placeholder="০১XXXXXXXXX"></div>
<div class="fd"><span>শিক্ষাবর্ষ</span><input class="g-in" name="session" type="text" placeholder="২০২৬"></div>
</div>
</div>
<p class="rt">এই কার্ড হারিয়ে গেলে বা কুড়িয়ে পেলে অনুগ্রহ করে নিচের ঠিকানায় ফেরত দিন।</p>
<div class="ob">
<textarea class="g-in g-ta" name="org_address" rows="2" placeholder="প্রতিষ্ঠানের ঠিকানা"></textarea>
<input class="g-in" name="org_contact" type="text" placeholder="ফোন / ওয়েবসাইট">
</div>
<div class="sg"><span class="sl"></span><span>প্রধান শিক্ষক / অধ্যক্ষের স্বাক্ষর</span></div>
<span class="ft" aria-hidden="true"></span>
</div>
