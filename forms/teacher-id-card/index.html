<body class="f-teacher-id-card" data-form="teacher-id-card">
<div id="g-form-pages">
<section class="g-page" lang="bn">
<div class="g-page-inner">
<div class="cards">
<div class="card">
<span class="hd0" aria-hidden="true"></span>
<span class="hd" aria-hidden="true"></span>
<label class="g-photo lgo" style="--w:10mm;--h:10mm">
<input type="file" accept="image/*" name="logo">
<span class="g-photo-hint">লোগো</span>
</label>
<textarea class="g-in g-ta org" name="org_name" rows="2" placeholder="প্রতিষ্ঠানের নাম"></textarea>
<label class="g-photo pic" style="--w:26mm;--h:26mm">
<input type="file" accept="image/*" name="photo" data-fill="photo">
<span class="g-photo-hint">ছবি দিতে<br>ক্লিক করুন</span>
</label>
<input class="g-in nm" name="name" type="text" data-fill="name" placeholder="শিক্ষকের নাম">
<input class="g-in dg" name="designation" type="text" placeholder="পদবি">
<div class="ln sb"><span>বিষয়:</span><input class="g-in" name="subject" type="text" placeholder="বিষয়"></div>
<div class="ln idn"><span>ID</span><input class="g-in" name="teacher_id" type="text" placeholder="ইনডেক্স / আইডি"></div>
<div class="ln vd"><span>মেয়াদ:</span><input class="g-in" name="valid_till" data-kind="date" type="text" placeholder="দিন/মাস/বছর"></div>
<span class="ft" aria-hidden="true"></span>
</div>
<div class="card">
<span class="hd2o" aria-hidden="true"></span>
<span class="hd2" aria-hidden="true"></span>
<div class="bt"><b>শিক্ষকের তথ্য</b><span>Teacher Information</span></div>
<div class="rows">
<div class="fd"><span>মোবাইল নম্বর</span><input class="g-in" name="phone" data-kind="phone" type="tel" data-fill="phone" placeholder="০১XXXXXXXXX"></div>
<div class="two">
<div class="fd"><span>রক্তের গ্রুপ</span><input class="g-in bd" name="blood" type="text" maxlength="3" data-fill="blood" placeholder="A+"></div>
<div class="fd"><span>যোগদান</span><input class="g-in" name="join_date" data-kind="date" type="text" placeholder="দিন/মাস/বছর"></div>
</div>
<div class="fd"><span>জাতীয় পরিচয় পত্র নং</span><input class="g-in" name="nid_no" data-kind="num" data-digits="en" type="text" inputmode="numeric" maxlength="17" data-fill="nid" placeholder="নম্বর"></div>
<div class="fd"><span>ঠিকানা</span><textarea class="g-in g-ta" name="address" rows="2" data-fill="address" placeholder="গ্রাম, ডাকঘর, উপজেলা, জেলা"></textarea></div>
</div>
<p class="rt">এই কার্ড হারিয়ে গেলে বা কুড়িয়ে পেলে অনুগ্রহ করে নিচের ঠিকানায় ফেরত দিন।</p>
<div class="ob">
<textarea class="g-in g-ta" name="org_address" rows="2" placeholder="প্রতিষ্ঠানের ঠিকানা"></textarea>
<input class="g-in" name="org_contact" type="text" placeholder="ফোন / ওয়েবসাইট">
</div>
<div class="sg"><span class="sl"></span><span>প্রধান শিক্ষক / অধ্যক্ষ</span></div>
<span class="ft" aria-hidden="true"></span>
</div>
